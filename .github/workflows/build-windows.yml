name: Build Windows Installer (Tauri v2)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run muvluv-core unit tests
        run: cargo test -p muvluv-core

      - name: Build Tauri NSIS installer and portable binary
        run: pnpm tauri build --bundles nsis

      - name: Prepare release artifacts (NSIS + Portable + SHA256)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null

          $nsis = Get-ChildItem -Path "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer .exe not found!" }
          $nsisOut = "release-artifacts/muvluv-ptbr-instalador-setup-x64.exe"
          Copy-Item $nsis.FullName $nsisOut

          $portable = "target/release/muvluv-ptbr-instalador.exe"
          if (-not (Test-Path $portable)) { throw "Portable .exe not found!" }
          $portableOut = "release-artifacts/muvluv-ptbr-instalador-portable-x64.exe"
          Copy-Item $portable $portableOut

          $hashes = @()
          foreach ($f in @($nsisOut, $portableOut)) {
            $h = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            $name = Split-Path $f -Leaf
            $hashes += "$h  $name"
          }
          $hashes | Out-File -Encoding ascii "release-artifacts/SHA256SUMS.txt"
          Get-ChildItem release-artifacts

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muvluv-ptbr-instalador-windows-x64
          path: release-artifacts/*

      - name: Publish GitHub Release on v* tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/muvluv-ptbr-instalador-setup-x64.exe
            release-artifacts/muvluv-ptbr-instalador-portable-x64.exe
            release-artifacts/SHA256SUMS.txt
